# =============================================================================
# OpsFlow — golangci-lint configuration
# =============================================================================

run:
  timeout: 5m
  go: "1.22"
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - revive
    - gosec
    - misspell
    - gofmt
    - goimports
    - bodyclose
    - exportloopref

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
        severity: warning
  gosec:
    excludes:
      - G104  # Unhandled errors in deferred calls — reviewed case by case
  misspell:
    locale: US

issues:
  exclude-rules:
    # Allow fmt.Println in main.go files
    - path: cmd/
      linters:
        - revive
      text: "exported"
    # Test files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 5

output:
  formats:
    - format: colored-line-number
  sort-results: true
