name: OpsFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Build & Test Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Go Workspace & Modules
        run: |
          go work sync

      - name: Build All Workspace Modules
        run: |
          for dir in pkg/common services/auth services/incident services/registry services/notification services/ai-gateway services/gateway; do
            echo "Building $dir..."
            (cd $dir && go build ./...)
          done

      - name: Run Go Unit & Integration Tests
        run: |
          for dir in pkg/common services/auth services/incident services/registry services/notification services/ai-gateway services/gateway; do
            echo "Testing $dir..."
            (cd $dir && go test -v -race ./...)
          done

  build-frontend:
    name: Build Frontend PWA (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite PWA Production Bundle
        working-directory: ./frontend
        run: npm run build
