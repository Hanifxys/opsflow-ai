openapi: 3.0.3
info:
  title: OpsFlow API
  description: Self-hostable, cloud-native operations platform API Gateway specification.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway

paths:
  /auth/login:
    post:
      summary: User Login
      description: Authenticate user credentials and return access and refresh JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@opsflow.local
                password:
                  type: string
                  example: changeme
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh Access Token
      description: Exchange a valid refresh token for a new access & refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed successfully

  /auth/me:
    get:
      summary: Get User Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile with assigned roles & permissions

  /incidents:
    get:
      summary: List Incidents
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
      responses:
        '200':
          description: List of incidents
    post:
      summary: Create Incident
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [SEV1, SEV2, SEV3, SEV4]
      responses:
        '201':
          description: Incident created

  /incidents/{id}:
    get:
      summary: Get Incident by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident details
    patch:
      summary: Update Incident Status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, INVESTIGATING, MITIGATING, RESOLVED, CLOSED]
                message:
                  type: string
      responses:
        '200':
          description: Incident status updated

  /incidents/{id}/resolve:
    post:
      summary: Resolve Incident
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Incident resolved

  /services:
    get:
      summary: List Services
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: owner_team
          schema:
            type: string
        - in: query
          name: criticality
          schema:
            type: string
      responses:
        '200':
          description: List of registered services
    post:
      summary: Register Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_team]
              properties:
                name:
                  type: string
                description:
                  type: string
                owner_team:
                  type: string
                criticality:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                repository_url:
                  type: string
      responses:
        '201':
          description: Service registered

  /services/{id}:
    get:
      summary: Get Service Details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service details with environments and dependencies

  /services/{id}/environments:
    post:
      summary: Add Environment to Service
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment:
                  type: string
                base_url:
                  type: string
                health_endpoint:
                  type: string
      responses:
        '201':
          description: Environment added

  /services/{id}/dependencies:
    post:
      summary: Add Dependency to Service
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on_service_id]
              properties:
                depends_on_service_id:
                  type: string
                  format: uuid
                dependency_type:
                  type: string
                critical:
                  type: boolean
      responses:
        '201':
          description: Dependency added

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
